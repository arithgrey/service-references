version: '3'

services:
  microservice_enid:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${SERVICENAME}_service
    container_name: ${SERVICENAME}_service
    ports:
      - "127.0.0.1:8082:8080"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      # Único interruptor dev/prod (ver app/settings.py). Default dev local.
      - APP_ENV=${APP_ENV:-dev}
    depends_on:
      - redis
      - postgres
    volumes:
      - .:/app
    networks:
      - backend
      - enid_service_network

  redis:
    container_name: ${SERVICENAME}_redis 
    image: redis:alpine
    command: sh -c "rm -rf /data/* && redis-server"
    volumes:
      - redis_data:/data
    networks:
      - backend

  postgres:
    container_name: ${SERVICENAME}_postgres
    image: postgres:alpine
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
   
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5

volumes:
  redis_data:
  postgres_data:

networks:
  backend:
    driver: bridge
  enid_service_network:
    external: true